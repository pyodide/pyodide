package:
  name: test
  version: 1.0.0 # Nonsense
  tag:
    - always
  top-level:
    - test
source:
  path: src
build:
  type: package
  unvendor-tests: false # Obviously :)
  script: |
    wget ${PYTHON_ARCHIVE_URL} -O Python-${PYVERSION}.tgz
    tar -xf Python-${PYVERSION}.tgz
    cd Python-${PYVERSION}

    # These used to be linked into the main module. Take the source lists from
    # Setup.stdlib.in so they stay in sync with CPython.
    export TEST_MODULES="\
      _testcapi \
      _testinternalcapi \
      _testlimitedcapi \
      _testclinic \
      _testclinic_limited \
      _testbuffer \
      _testimportmultiple \
      _testmultiphase \
      _xxtestfuzz \
      xxsubtype \
      _ctypes_test \
    "

    export TEST_MODULE_CFLAGS="${SIDE_MODULE_CFLAGS} -I Include/ -I Include/internal/ -I ."

    for mod in ${TEST_MODULES}; do
      srcs=$(sed -n "s/^@MODULE_[A-Z0-9_]*_TRUE@${mod} //p" Modules/Setup.stdlib.in)
      if [ -z "${srcs}" ]; then
        echo "No sources found for ${mod} in Modules/Setup.stdlib.in"
        exit 1
      fi
      objs=()
      for src in ${srcs}; do
        emcc ${TEST_MODULE_CFLAGS} -c Modules/${src} -o Modules/${src%.c}.o
        objs+=(Modules/${src%.c}.o)
      done
      emcc ${SIDE_MODULE_LDFLAGS} "${objs[@]}" -o ${PKG_BUILD_DIR}/${mod}.so
    done

    cd Lib && \
      tar --exclude=__pycache__ -cf - \
      test \
      | tar -C ${PKG_BUILD_DIR} -xf -
about:
  license: PSF
